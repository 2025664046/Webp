<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도형 서식 폼 만들기</title>
</head>
<body>
<h3>도형 서식 폼 만들기</h3>
<hr>
<form>
    <fieldset>
        <legend>도형 서식 입력</legend>
        <label>선종류
        <select size="3">
            <option>선없음</option>
            <option>실선</option>
            <option>점선</option>
        </select>
        </label>
        <br><br>
        <label>선두께 <input type="number" min="1" max="50" step="1"></label>
        <label>선색 <input type="color"></label>
        <br><br>
        <label>투명도(0~100) :
        <input type="range" min="0" max="100" list="opacity">
        </label>
        <datalist id="opacity">
            <option value="0" label="Low">
            <option value="50" label="Medium">
            <option value="100" label="High">
        </datalist>
    </fieldset>
</form>
</body>
</html>
