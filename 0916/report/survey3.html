<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어 기술 선호에 관한 설문</title>
</head>
<body>
<header>
    <h1>설문지</h1>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
</header>
<section>
<hr>
<form>
    학년
    <label><input type="radio" name="grade" value="1" checked>1학년</label>
    <label><input type="radio" name="grade" value="2">2학년</label>
    <label><input type="radio" name="grade" value="3">3학년</label>
    <label><input type="radio" name="grade" value="4">4학년</label>
    <br><br>
    성별
    <label><input type="radio" name="gender" value="male">남</label>
    <label><input type="radio" name="gender" value="female">여</label>
    <br><br>
    <label fot="interest">관심 분야</label>
    <select id="interest" name="interest">
        <option value="mobile" selected>모바일 소프트웨어</option>
        <option value="Web">웹 프로그래밍</option>
        <option value="game">게임</option>
    </select>
    <br><br>
    진로
    <label><input type="checkbox" name="path" value="dev" checked>개발</label>
    <label><input type="checkbox" name="path" value="plan">기획</label>
    <label><input type="checkbox" name="path" value="sales">영업</label>
    <label><input type="checkbox" name="path" value="startup">창업</label>
    <br><br>
    <label for="comment">남기고 싶은 말</label>
    <br>
    <textarea id="comment" name="comment" cols="60" rows="15" placeholder="글을 남겨주세요"></textarea>
</form>
</section>
    <footer>
        <p>Copyright 2022 by Kitae</p>
    </footer>
</body>
</html>
