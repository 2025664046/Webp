<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별 문자 출력하기</title>
<script>
    function printStar() {
        n = parseInt(n);
        if (isNaN(n)) {
            document.write("입력 오류입니다.");
        }
        for (i = 0; i < n; i++) {
            for (j = 0; j <= i; j++) {
                document.write("*");
            }
            document.write("<br>");
        }
    }
</script>
</head>
<body>
<h3>별 문자 출력하기</h3>
<script>
    var n = prompt("정수를 입력하세요", "1");
    printStar(n);
</script>
</body>
</html>
